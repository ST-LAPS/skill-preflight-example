name: Consumer integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check this repository using the remote action
        id: check
        uses: ST-LAPS/skill-preflight@7320cb943779d92e2e11c6df5d0180f705850130
        with:
          path: .
          language: ar
          strict: 'true'
      - name: Verify clean Arabic skill
        shell: bash
        env:
          SKILLS: ${{ steps.check.outputs.skills }}
          ERRORS: ${{ steps.check.outputs.errors }}
          WARNINGS: ${{ steps.check.outputs.warnings }}
        run: |
          test "$SKILLS" = "1"
          test "$ERRORS" = "0"
          test "$WARNINGS" = "0"
